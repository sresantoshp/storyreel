[project]
name = "storyreel"
version = "0.1.0"
description = "Text-to-video studio that runs on weak laptops: chunked, streaming, crash-resumable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0",
    "platformdirs>=4.2",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "uharfbuzz>=0.40",
    "freetype-py>=2.5",
    "huggingface-hub>=0.34",
    "kokoro-onnx>=0.6.1",
]

[project.scripts]
storyreel = "storyreel.cli:main"

[project.optional-dependencies]
translate = [
    "indic-nlp-library>=0.92",
    "sacremoses>=0.1",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "transformers>=4.46,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storyreel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "PTH", "SIM"]
ignore = [
    "S603", "S607",  # subprocess with fixed argv lists is the core design (ffmpeg pipes)
    "S101",  # asserts only narrow types of Popen pipes that are always set
    "RUF046",  # int(round(x)): with numpy scalars round() may not return a Python int
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# table names come from a hard-coded whitelist checked in _cols(); values are parameters
"src/storyreel/project/edits.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src/storyreel"]

[[tool.mypy.overrides]]
module = ["uharfbuzz", "freetype", "freetype.*"]  # C extensions without type stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # no type stubs; used only in the TTS worker
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs a working ffmpeg binary"]
