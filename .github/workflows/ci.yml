# Tests, lint and strict typing on every push and pull request, on Linux and Windows.
# Free for public repositories on GitHub-hosted runners. Builds and tests the tool only;
# GitHub's Actions terms do not allow using it to produce content such as videos.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Install project
        run: uv sync --python ${{ matrix.python }}

      - name: Environment check
        run: uv run storyreel doctor --no-hw-test

      - name: Lint
        run: |
          uv run ruff check src tests bench examples
          uv run ruff format --check src tests bench examples

      - name: Types (mypy --strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q -W error::RuntimeWarning
